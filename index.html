<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HGJS — Photography</title>
<meta name="description" content="Product · Beauty · Still life · Food photography.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a href="index.html" class="hdr__logo">HGJS</a>
    <nav class="hdr__nav">
      <a href="work.html">Work</a>
      <a href="about.html">About · Contact</a>
    </nav>
  </div>
</header>

<main>

  <!-- 메인 문장 + 짧은 자기소개: 아래 두 문단을 원하는 내용으로 교체하세요 -->
  <div class="statement reveal">
    <p class="statement__lead">Photography that finds stillness in everyday things.</p>
    <p class="statement__body">Photographer based in Seoul, working across beauty, product, and still life.
Focused on light, texture, and quiet composition.
Currently open to new collaborations.</p>
  </div>

  <!-- 메인 비주얼: 사진 또는 영상.
       data-hero="image" ↔ "video" 값만 바꾸면 전환됩니다.
       영상은 유튜브(미등록) 임베드를 직접 붙여넣어 사용하세요. -->
  <section class="hero-main reveal" data-hero="image">
    <a class="hero-link lightbox-trigger" href="#">
      <img class="hero-media" src="images/home-hero.jpg" alt="" draggable="false">
      <!-- 영상으로 전환 시 위 img를 지우고 아래 iframe의 주석을 해제하세요
      <div class="hero-media" style="position:relative">
        <iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=VIDEO_ID&controls=0&modestbranding=1&rel=0"
          style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay"></iframe>
      </div>
      -->
    </a>
  </section>

  <!-- 큐레이션 이미지: 3열로 계속 아래로. 사진을 누르면 검정 배경 팝업(라이트박스)으로 크게 보이고,
       양옆 화살표로 홈에 있는 사진·영상만 계속 돌려볼 수 있습니다. (Work 페이지처럼 다른 페이지로 이동하지 않습니다) -->
  <section class="curated">
    <div class="wrap curated__grid">
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-01.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-02.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-03.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-04.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-05.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-06.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-07.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-08.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-09.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-10.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-11.jpg" alt="" loading="lazy" draggable="false"></a>
      <a class="reveal lightbox-trigger" href="#"><img src="images/home-12.jpg" alt="" loading="lazy" draggable="false"></a>
    </div>
  </section>

</main>

<footer class="ftr">
  <span>HGJS</span>
  <span>© 2026</span>
</footer>

<button class="totop" aria-label="맨 위로">↑</button>

<!-- 라이트박스: 홈 사진/영상 클릭 시 검정 배경 팝업으로 크게 보여주는 영역 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox__close" aria-label="닫기">✕</button>
  <button class="lightbox__nav lightbox__prev" aria-label="이전 사진">←</button>
  <div class="lightbox__stage"></div>
  <button class="lightbox__nav lightbox__next" aria-label="다음 사진">→</button>
  <p class="lightbox__count"></p>
</div>

<script src="app.js"></script>
</body>
</html>
