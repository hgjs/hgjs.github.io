<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HGJS — Photography</title>
<meta name="description" content="Product · Beauty · Still life · Food photography.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a href="index.html" class="hdr__logo">HGJS</a>
    <nav class="hdr__nav">
      <a href="work.html">Work</a>
      <a href="services.html">Services</a>
      <a href="about.html">About · Contact</a>
    </nav>
  </div>
</header>

<main>

  <!-- 한 줄 스테이트먼트: 아래 문장을 원하는 영문 문장으로 교체하세요 -->
  <div class="statement reveal">
    <p>PLACEHOLDER — REPLACE WITH YOUR ONE-LINE STATEMENT</p>
  </div>

  <!-- 메인 비주얼: 사진 또는 영상.
       data-hero="image" ↔ "video" 값만 바꾸면 전환됩니다.
       영상은 유튜브(미등록) 임베드를 직접 붙여넣어 사용하세요. -->
  <section class="hero-main reveal" data-hero="image">
    <img class="hero-media" src="images/home-hero.jpg" alt="">
    <!-- 영상으로 전환 시 위 img를 지우고 아래 iframe의 주석을 해제하세요
    <div class="hero-media" style="position:relative">
      <iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=VIDEO_ID&controls=0&modestbranding=1&rel=0"
        style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay"></iframe>
    </div>
    -->
  </section>

  <!-- 큐레이션 이미지: 3열로 계속 아래로. 순서와 장수는 자유롭게 조정하세요 -->
  <section class="curated">
    <div class="wrap curated__grid">
      <img class="reveal" src="images/home-01.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-02.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-03.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-04.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-05.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-06.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-07.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-08.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-09.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-10.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-11.jpg" alt="" loading="lazy">
      <img class="reveal" src="images/home-12.jpg" alt="" loading="lazy">
    </div>
  </section>

</main>

<footer class="ftr">
  <span>HGJS</span>
  <span>© 2026</span>
</footer>

<button class="totop" aria-label="맨 위로">↑</button>

<script src="app.js"></script>
</body>
</html>
