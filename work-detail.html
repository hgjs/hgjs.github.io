<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — HGJS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a href="index.html" class="hdr__logo">HGJS</a>
    <nav class="hdr__nav">
      <a href="work.html">Work</a>
      <a href="about.html">About · Contact</a>
    </nav>
  </div>
</header>

<main>

  <div class="detail-hero reveal">
    <p class="detail-hero__cat">Product</p>
    <h1>Project Title</h1>
  </div>

  <div class="bleed reveal">
    <img src="images/work-detail-cover.jpg" alt="">
  </div>

  <!-- 같은 프로젝트의 다른 사진들. 필요한 만큼 img를 더 추가하세요 -->
  <div class="shots reveal">
    <img src="images/work-detail-01.jpg" alt="" loading="lazy">
    <img src="images/work-detail-02.jpg" alt="" loading="lazy">
    <img src="images/work-detail-03.jpg" alt="" loading="lazy">
    <img src="images/work-detail-04.jpg" alt="" loading="lazy">

    <!-- 영상 자리: 이 프로젝트에 영상이 있으면 아래 div 안을
         유튜브(또는 다른) 임베드 코드로 바꿔서 넣으세요.
         예: <iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID" ...></iframe> -->
    <div class="video-slot">여기에 영상 임베드 코드를 붙여넣으세요</div>
  </div>

  <div class="pager reveal">
    <a href="work.html">← Back to Work</a>
    <a href="work.html">Next →</a>
  </div>

</main>

<footer class="ftr">
  <span>HGJS</span>
  <span>© 2026</span>
</footer>

<button class="totop" aria-label="맨 위로">↑</button>

<script src="app.js"></script>
</body>
</html>
