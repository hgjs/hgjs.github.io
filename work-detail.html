<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — HGJS</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<!--
  이 파일은 "새 프로젝트 추가용 템플릿"입니다. 10번째 이후 프로젝트를 추가할 때:
  1) 이 파일을 복사해서 work-detail-10.html 처럼 이름 짓기
  2) 아래 카테고리(Product) / Project Title / 이미지 경로를 새 프로젝트에 맞게 수정
  3) work.html의 <div class="masonry"> 안에 새 <a> 타일 추가하고 href를 이 파일로 연결
  4) pager의 Next 링크가 자연스럽게 이어지도록 앞뒤 프로젝트 파일의 Next 링크도 손보기
  자세한 건 edit-guide.md 참고하세요.
-->

<header class="hdr">
  <div class="wrap">
    <a href="index.html" class="hdr__logo">HGJS</a>
    <nav class="hdr__nav">
      <a href="work.html">Work</a>
      <a href="about.html">About · Contact</a>
    </nav>
  </div>
</header>

<!-- 좌우 중앙 화살표: 이전/다음 프로젝트로 이동. href를 앞뒤 프로젝트 파일로 연결하세요 -->
<a href="work-detail-09.html" class="detail-nav detail-nav--prev" aria-label="이전 프로젝트">←</a>
<a href="work-detail-01.html" class="detail-nav detail-nav--next" aria-label="다음 프로젝트">→</a>

<main>

  <div class="detail-hero reveal">
    <p class="detail-hero__cat">Product</p>
    <h1>Project Title</h1>
  </div>

  <div class="bleed reveal">
    <img src="images/work-10.jpg" alt="">
  </div>

  <!-- 같은 프로젝트의 다른 사진들. 필요한 만큼 img를 더 추가하세요 -->
  <div class="shots reveal">
    <img src="images/work-10-1.jpg" alt="" loading="lazy">
    <img src="images/work-10-2.jpg" alt="" loading="lazy">
    <img src="images/work-10-3.jpg" alt="" loading="lazy">
    <img src="images/work-10-4.jpg" alt="" loading="lazy">

    <!-- 영상 자리: 모든 프로젝트에 영상이 있는 건 아니라서 기본값은 숨김(주석) 처리했습니다.
         이 프로젝트에 영상이 있으면 아래 주석을 해제하고 iframe src를 실제 유튜브 영상으로 바꾸세요.
    <div class="video-slot">
      <iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID?rel=0" style="width:100%;height:100%;border:0" allow="autoplay"></iframe>
    </div>
    -->
  </div>

  <div class="pager reveal">
    <a href="work.html">← Back to Work</a>
  </div>

</main>

<footer class="ftr">
  <span>HGJS</span>
  <span>© 2026</span>
</footer>

<button class="totop" aria-label="맨 위로">↑</button>

<script src="app.js?v=2"></script>
</body>
</html>
